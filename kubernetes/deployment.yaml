apiVersion: apps/v1
kind: Deployment
metadata:
  name: india-map-production
  namespace: default
  labels:
    app: india-map
    env: production
    service: india-map
spec:
  replicas: 2
  selector:
    matchLabels:
      app: india-map
  template:
    metadata:
      labels:
        app: india-map
        env: production
        service: india-map
      annotations:
        ad.datadoghq.com/india-map.logs: '[{"source": "nodejs", "service": "india-map"}]'
    spec:
      containers:
      - name: india-map
        image: your-account-id.dkr.ecr.us-east-1.amazonaws.com/map-backend:latest
        ports:
        - containerPort: 8080
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "8080"
        resources:
          requests:
            memory: "1.5Gi"
            cpu: "250m"
          limits:
            memory: "2Gi" # Updated to 2GB
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
