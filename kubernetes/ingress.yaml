apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: india-map-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
  - host: api.india-map.com # Replace with your actual domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: india-map-service
            port:
              number: 80
